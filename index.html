<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 관리자</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-input-wrapper::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        .btn-add {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
        }

        .form-container {
            background: #f8f9ff;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            display: none;
        }

        .form-container.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-save {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: white;
            color: #333;
            border: 1.5px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: #f8f9ff;
            border-color: #667eea;
        }

        .sites-list {
            display: grid;
            gap: 12px;
        }

        .site-card {
            background: white;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            padding: 18px;
            position: relative;
            transition: all 0.3s ease;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .site-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-edit, .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .btn-edit:hover {
            color: #667eea;
            transform: scale(1.2);
        }

        .btn-delete:hover {
            color: #e24b4a;
            transform: scale(1.2);
        }

        .login-type-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-naver {
            background: #00C73C;
            color: white;
        }

        .badge-kakao {
            background: #FFE812;
            color: #000;
        }

        .badge-google {
            background: #4285F4;
            color: white;
        }

        .badge-general {
            background: #666;
            color: white;
        }

        .site-card h3 {
            font-size: 16px;
            margin: 0 0 12px 0;
            color: #333;
            padding-right: 70px;
        }

        .site-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .info-icon {
            font-size: 16px;
        }

        .password-display {
            letter-spacing: 2px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
            margin: 0;
        }

        .stats-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1.5px solid #e0e0e0;
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-results-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .no-results p {
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 비밀번호 관리자</h1>
            <p>사이트별 로그인 정보를 안전하게 정리하세요</p>
        </div>

        <div class="content">
            <!-- 검색 섹션 -->
            <div class="search-section">
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="사이트 이름으로 검색 (예: 클로, ㅋㄹㄷ)"
                    >
                </div>
                <button class="btn-add" id="btnAddForm">
                    ➕ 추가
                </button>
            </div>

            <!-- 추가/수정 폼 -->
            <div class="form-container" id="formContainer">
                <div class="form-title" id="formTitle">새 비밀번호 추가</div>
                <form id="addForm">
                    <div class="form-group">
                        <label for="siteName">사이트 이름</label>
                        <input 
                            type="text" 
                            id="siteName" 
                            placeholder="예: 클로드, 네이버"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginType">로그인 방식</label>
                        <select id="loginType">
                            <option value="naver">네이버</option>
                            <option value="kakao">카카오</option>
                            <option value="google">구글</option>
                            <option value="general" selected>일반 로그인</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="아이디를 입력하세요"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="비밀번호를 입력하세요"
                            required
                        >
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn-save" id="btnSave">저장</button>
                        <button type="button" class="btn-cancel" id="btnCancel">취소</button>
                    </div>
                </form>
            </div>

            <!-- 사이트 목록 -->
            <div id="sitesList" class="sites-list"></div>

            <!-- 통계 -->
            <div id="statsFooter" class="stats-footer"></div>
        </div>
    </div>

    <script>
        // 한글 초성 배열
        const chosung = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

        // 한글 문자를 초성으로 변환
        function getChosung(char) {
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const temp = code - 0xAC00;
                const chosungIndex = Math.floor(temp / 588);
                return chosung[chosungIndex] || char;
            }
            return char;
        }

        // 문자열을 초성으로 변환
        function stringToChosung(str) {
            return str.split('').map(char => getChosung(char)).join('');
        }

        // 검색 매칭
        function matchesSearch(siteName, query) {
            if (!query) return true;

            const lowerSiteName = siteName.toLowerCase();
            const lowerQuery = query.toLowerCase();

            // 부분 문자열 매칭
            if (lowerSiteName.includes(lowerQuery)) return true;

            // 초성 매칭
            const siteChosung = stringToChosung(siteName).toLowerCase();
            const queryChosung = stringToChosung(query).toLowerCase();

            return siteChosung.includes(queryChosung);
        }

        // 상태 관리
        let sites = [];
        let editingId = null;

        // 데이터 로드
        function loadData() {
            const saved = localStorage.getItem('passwordManager');
            if (saved) {
                try {
                    sites = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to load data:', e);
                }
            }
        }

        // 데이터 저장
        function saveData() {
            localStorage.setItem('passwordManager', JSON.stringify(sites));
        }

        // 사이트 추가
        function addSite(name, loginType, username, password) {
            const newSite = {
                id: Date.now(),
                name,
                loginType,
                username,
                password
            };
            sites.push(newSite);
            saveData();
            renderSites();
        }

        // 사이트 수정
        function updateSite(id, name, loginType, username, password) {
            const siteIndex = sites.findIndex(s => s.id === id);
            if (siteIndex !== -1) {
                sites[siteIndex] = {
                    id,
                    name,
                    loginType,
                    username,
                    password
                };
                saveData();
                renderSites();
            }
        }

        // 사이트 삭제
        function deleteSite(id) {
            if (confirm('이 항목을 삭제하시겠습니까?')) {
                sites = sites.filter(site => site.id !== id);
                saveData();
                renderSites();
            }
        }

        // 수정 모드 시작
        function startEdit(id) {
            editingId = id;
            const site = sites.find(s => s.id === id);
            if (site) {
                document.getElementById('siteName').value = site.name;
                document.getElementById('loginType').value = site.loginType;
                document.getElementById('username').value = site.username;
                document.getElementById('password').value = site.password;
                document.getElementById('formTitle').textContent = '비밀번호 수정';
                document.getElementById('btnSave').textContent = '수정 완료';
                document.getElementById('formContainer').classList.add('show');
                document.getElementById('siteName').focus();
            }
        }

        // 수정 모드 취소
        function cancelEdit() {
            editingId = null;
            document.getElementById('addForm').reset();
            document.getElementById('formTitle').textContent = '새 비밀번호 추가';
            document.getElementById('btnSave').textContent = '저장';
            document.getElementById('formContainer').classList.remove('show');
        }

        // 사이트 렌더링
        function renderSites() {
            const searchQuery = document.getElementById('searchInput').value;
            const filteredSites = sites.filter(site => matchesSearch(site.name, searchQuery));
            const sitesList = document.getElementById('sitesList');

            if (filteredSites.length === 0) {
                if (sites.length === 0) {
                    sitesList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>저장된 사이트가 없습니다</p>
                        </div>
                    `;
                } else {
                    sitesList.innerHTML = `
                        <div class="no-results">
                            <div class="no-results-icon">🔍</div>
                            <p>검색 결과가 없습니다</p>
                        </div>
                    `;
                }
            } else {
                sitesList.innerHTML = filteredSites.map(site => {
                    const badgeClass = `badge-${site.loginType}`;
                    const loginTypeLabel = {
                        naver: '네이버',
                        kakao: '카카오',
                        google: '구글',
                        general: '일반'
                    };

                    const passwordDisplay = '●'.repeat(site.password.length);

                    return `
                        <div class="site-card">
                            <div class="card-actions">
                                <button class="btn-edit" onclick="startEdit(${site.id})" title="수정">✏️</button>
                                <button class="btn-delete" onclick="deleteSite(${site.id})" title="삭제">🗑️</button>
                            </div>
                            <div class="login-type-badge ${badgeClass}">
                                ${loginTypeLabel[site.loginType]}
                            </div>
                            <h3>${site.name}</h3>
                            <div class="site-info">
                                <div class="info-row">
                                    <span class="info-icon">👤</span>
                                    <span>${site.username}</span>
                                </div>
                                <div class="info-row">
                                    <span class="info-icon">🔒</span>
                                    <span class="password-display">${passwordDisplay}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 통계 업데이트
            const statsFooter = document.getElementById('statsFooter');
            if (sites.length > 0) {
                statsFooter.innerHTML = `총 <strong>${sites.length}</strong>개의 사이트 정보 저장됨`;
            } else {
                statsFooter.innerHTML = '';
            }
        }

        // 이벤트 리스너
        document.getElementById('btnAddForm').addEventListener('click', () => {
            if (editingId !== null) {
                cancelEdit();
            } else {
                const form = document.getElementById('formContainer');
                form.classList.toggle('show');
                if (form.classList.contains('show')) {
                    document.getElementById('siteName').focus();
                }
            }
        });

        document.getElementById('btnCancel').addEventListener('click', () => {
            cancelEdit();
        });

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('siteName').value.trim();
            const loginType = document.getElementById('loginType').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !username || !password) {
                alert('모든 필드를 입력해주세요');
                return;
            }

            if (editingId !== null) {
                updateSite(editingId, name, loginType, username, password);
                cancelEdit();
            } else {
                addSite(name, loginType, username, password);
                document.getElementById('addForm').reset();
                document.getElementById('formContainer').classList.remove('show');
            }
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            renderSites();
        });

        // 초기화
        loadData();
        renderSites();
    </script>
</body>
</html>
